        - name: format
          in: query
          schema: { type: string, enum: [html, pdf, json], default: html }
      responses:
        '200':
          description: 리포트
          content:
            text/html: { schema: { type: string } }
            application/pdf: { schema: { type: string, format: binary, description: '준비 중 (501) — 지금은 html을 인쇄해 PDF로 저장' } }
            application/json: { schema: { $ref: '#/components/schemas/Report' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 아직 분석 중
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }

  /v1/assessments/{assessment_id}/messages:
    post:
      tags: [chat]
      operationId: postMessage
      summary: 평가 결과에 대해 질문 (대화형)
      description: |
        평가 결과와 내부 도구(경쟁점 목록, 매출 벤치마크 등)를 근거로 답한다.
        `Accept: text/event-stream`이면 SSE로 스트리밍하고, 아니면 완성된 답을 JSON으로 돌려준다.
        대화 이력은 평가 단위로 서버에 보관된다.
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 4000, examples: ['반경 300m 안 카페 중 최근 1년 사이 폐업한 곳은?'] }
      responses:
        '200':
          description: 답변
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatReply' }
              example:
                {
                  "message_id": "msg_Q2w8Lr0aZk3PdX9cVb1n",
                  "text": "네, 많은 편입니다. 반경 300m 안에 같은 업종(백반/한정식)이 73곳으로, 서울 평균 대비 1.29배 밀집되어 있습니다(경쟁 강도, 소상공인 상가정보 2026Q2). 최근 1년 사이 주변 음식점은 41곳이 문을 열고 43곳이 닫았습니다(지방행정 인허가).",
                  "citations": [
                    {
                      "source": "소상공인시장진흥공단",
                      "dataset": "상가(상권)정보",
                      "as_of": "2026Q2 (20260630)",
                      "used_for": [
                        "competitors"
                      ]
                    }
                  ]
                }
            text/event-stream:
              schema:
                type: string
                description: |
                  이벤트: `delta` {text}, `done` {message_id, citations}, `error` {title, detail}
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 평가가 아직 끝나지 않음
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
    get:
      tags: [chat]
      operationId: listMessages
      summary: 대화 이력
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      responses:
        '200':
          description: 이력
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/ChatMessage' }

