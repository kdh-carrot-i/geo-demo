openapi: 3.1.0
info:
  title: 상권 경쟁력 분석 Agent API
  version: 0.1.0-draft
  description: |
    출점·출자 검토용 의사결정 **참고** API. 좌표·로드뷰 이미지·상호·업종을 받아
    상권 점수, 매출 예측 범위, 지표, 리포트, 대화형 질의를 제공한다.

    - 결과는 참고용이며 투자 판단을 대신하지 않는다. 모든 수치에 출처(`provenance`)와 신뢰등급(A/B/C)을 붙인다.
    - 서울과 전국은 제공 항목이 다르다. 위치별 제공 범위는 `GET /v1/coverage`로 먼저 확인한다.
    - 분석은 수십 초가 걸리므로 비동기다: `POST /v1/assessments` → `202` → `GET /v1/assessments/{id}` 폴링 (또는 `?wait=30`).
    - 사업자번호는 상태 확인에만 쓰고 저장·응답·학습에 사용하지 않는다.

    설계 문서: docs/08_API_명세.md
servers:
  - url: http://127.0.0.1:8787/api
    description: 로컬 개발
security:
  - ApiKey: []
tags:
  - name: assessments
    description: 입지 평가 (점수·매출·지표·리포트)
  - name: chat
    description: 평가 결과에 대한 대화형 질의
  - name: areas
    description: 상권 일대 분석 (업종 분포·배치, 인구, 교통, 시설, 임대료, 매출)
  - name: reference
    description: 제공 범위, 업종 코드

paths:
  /v1/assessments:
    get:
      tags: [assessments]
      operationId: listAssessments
      summary: 지난 평가 목록 (최신순)
      description: 심사 화면의 "지난 평가" 목록용.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        assessment_id: { type: string }
                        created_at: { type: string, format: date-time }
                        status: { $ref: '#/components/schemas/Status' }
                        client_ref: { type: [string, 'null'] }
                        address: { type: [string, 'null'] }
                        industry: { type: [string, 'null'] }
                        score: { type: [number, 'null'] }
                        grade: { type: [string, 'null'] }
                        error: { type: [string, 'null'], description: status=failed일 때 사유 제목 }
              example:
                items:
                  - { assessment_id: asm_lRhcO0pYuoCj32GoI15A, created_at: '2026-10-30T07:18:25Z', status: done, client_ref: deal-2026-0412, address: 서울특별시 중구 세종대로 110, industry: 백반/한정식, score: 41.8, grade: C, error: null }
    post:
      tags: [assessments]
      operationId: createAssessment
      summary: 입지 평가 요청
      description: 좌표 또는 주소 중 하나는 필수. 로드뷰 이미지가 없으면 `roadview_auto=true`일 때 좌표로 자동 수집한다.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: 같은 키로 재요청하면 기존 평가를 돌려준다 (24시간).
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/AssessmentRequest' }
            encoding:
              roadview_images:
                contentType: image/jpeg, image/png, image/webp
          application/json:
            schema: { $ref: '#/components/schemas/AssessmentRequestJson' }
            examples:
              seoul_full:
                summary: 서울 · 업종·면적·사업자번호까지 (권장)
                value:
                  {
                    "lat": 37.5663,
                    "lng": 126.9779,
                    "industry": "한식",
                    "floor_area_m2": 66,
                    "store_name": "OO식당",
                    "biz_no": "1234567890",
                    "radius_m": 300,
                    "client_ref": "deal-2026-0412"
                  }
              address_only:
                summary: 주소와 업종만
                value:
                  {
                    "address": "서울 마포구 동교로 240",
                    "industry": "카페"
                  }
              store_name_only:
                summary: 상호로 업종 추정 (신뢰도 낮음)
                value:
                  {
                    "lat": 37.5009,
                    "lng": 127.0365,
                    "store_name": "스타벅스"
                  }
              outside_seoul:
                summary: 서울 밖 — 유동인구는 경기 실측 학습 추정값(내부 심사 한정), 매출 예측은 준비 중 안내
                value:
                  {
                    "address": "부산 해운대구 달맞이길117번길 11",
                    "industry": "카페",
                    "floor_area_m2": 50
                  }
              non_food:
                summary: 음식점 외 업종 — 생존 확률 없이 계산, 등급 최대 B
                value:
                  {
                    "lat": 37.4979,
                    "lng": 127.0276,
                    "industry": "미용실"
                  }
              invalid_radius:
                summary: (오류 예시) 반경 200 → 400 "반경(radius_m)은 100, 300, 500, 1000 중 하나입니다"
                value:
                  {
                    "lat": 37.5663,
                    "lng": 126.9779,
                    "industry": "카페",
                    "radius_m": 200
                  }
              invalid_biz_no:
                summary: (오류 예시) 사업자번호 하이픈 → 400 "하이픈 없이 숫자 10자리"
                value:
                  {
                    "lat": 37.5663,
                    "lng": 126.9779,
                    "industry": "한식",
                    "biz_no": "124-81-00998"
                  }
              with_roadview_base64:
                summary: 로드뷰 이미지를 base64로 (JSON)
                value:
                  {
                    "lat": 37.5636,
                    "lng": 126.9828,
                    "industry": "I21007",
                    "floor_area_m2": 40,
                    "roadview_images_base64": [
                      {
                        "media_type": "image/jpeg",
                        "data": "/9j/4AAQSkZJRgABAQ...(생략)"
                      }
                    ]
                  }
      responses:
        '202':
          description: 접수됨
          headers:
            Location:
              schema: { type: string }
              description: /v1/assessments/{id}
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssessmentAccepted' }
              example:
                {
                  "assessment_id": "asm_lRhcO0pYuoCj32GoI15A",
                  "status": "queued",
                  "estimated_seconds": 40,
                  "links": {
                    "self": "/api/v1/assessments/asm_lRhcO0pYuoCj32GoI15A",
                    "report": "/api/v1/assessments/asm_lRhcO0pYuoCj32GoI15A/report",
                    "messages": "/api/v1/assessments/asm_lRhcO0pYuoCj32GoI15A/messages"
                  }
                }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/assessments/{assessment_id}:
    get:
      tags: [assessments]
      operationId: getAssessment
      summary: 평가 결과 조회
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
        - name: wait
          in: query
          description: 완료될 때까지 최대 N초 대기 (long polling). 0이면 즉시 반환.
          schema: { type: integer, minimum: 0, maximum: 60, default: 0 }
      responses:
        '200':
          description: 평가 (status가 done이 아니면 일부 필드가 비어 있음)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assessment' }
